[tools]
xcodegen = "2.47.0"

[tasks.gen]
description = "project.yml から Visper.xcodeproj を生成"
run = "xcodegen generate --quiet"

[tasks.build]
description = "Debug ビルド"
depends = ["gen"]
run = "xcodebuild -project Visper.xcodeproj -scheme Visper -configuration Debug -derivedDataPath build.noindex -quiet build"

[tasks.run]
description = "ビルドして起動"
depends = ["build"]
run = "open build.noindex/Build/Products/Debug/Visper.app"

[tasks.test]
description = "ロジックのテストと UI テスト"
depends = ["gen"]
run = "xcodebuild -project Visper.xcodeproj -scheme Visper -derivedDataPath build.noindex -quiet test"

[tasks.dmg]
description = "Release ビルドを作り、アプリケーションフォルダへドラッグして入れるディスクイメージを開く"
depends = ["gen"]
run = """
set -e
LSREGISTER=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
B=build.noindex
xcodebuild -project Visper.xcodeproj -scheme Visper -configuration Release -derivedDataPath $B -quiet build
rm -rf $B/dmg $B/Visper.dmg
mkdir -p $B/dmg
cp -R $B/Build/Products/Release/Visper.app $B/dmg/
ln -s /Applications $B/dmg/Applications
hdiutil create -volname Visper -srcfolder $B/dmg -ov -format UDZO -quiet $B/Visper.dmg
# ビルドの途中でできたコピーを消して登録も外す。ランチャーに Visper が複数出ないようにするため。
for app in $B/dmg/Visper.app $B/Build/Products/Release/Visper.app; do
  $LSREGISTER -u "$PWD/$app" || true
  rm -rf "$app"
done
rm -rf $B/dmg
open $B/Visper.dmg
"""
