[tools]
xcodegen = "2.47.0"

[tasks.gen]
description = "project.yml から Visper.xcodeproj を生成"
run = "xcodegen generate --quiet"

[tasks.build]
description = "Debug ビルド"
depends = ["gen"]
run = "xcodebuild -project Visper.xcodeproj -scheme Visper -configuration Debug -derivedDataPath build -quiet build"

[tasks.run]
description = "ビルドして起動"
depends = ["build"]
run = "open build/Build/Products/Debug/Visper.app"

[tasks.test]
description = "ロジックのテストと UI テスト"
depends = ["gen"]
run = "xcodebuild -project Visper.xcodeproj -scheme Visper -derivedDataPath build -quiet test"

[tasks.dmg]
description = "Release ビルドを作り、アプリケーションフォルダへドラッグして入れるディスクイメージを開く"
depends = ["gen"]
run = """
set -e
xcodebuild -project Visper.xcodeproj -scheme Visper -configuration Release -derivedDataPath build -quiet build
rm -rf build/dmg build/Visper.dmg
mkdir -p build/dmg
cp -R build/Build/Products/Release/Visper.app build/dmg/
ln -s /Applications build/dmg/Applications
hdiutil create -volname Visper -srcfolder build/dmg -ov -format UDZO -quiet build/Visper.dmg
open build/Visper.dmg
"""
